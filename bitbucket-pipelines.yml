
# cspell: disable
image: ghcr.io/cirruslabs/flutter:3.29.2

definitions:
  # Define caches to speed up subsequent builds
  caches:
    flutter: /opt/flutter # Cache Flutter SDK
    pub: $HOME/.pub-cache # Cache Flutter package dependencies
    node: $HOME/.npm # Cache Node.js packages
    firebase: $HOME/.firebase # Cache Firebase CLI
    firebase-tools: $HOME/.cache/firebase-tools # Cache Firebase tools
  # Define reusable steps using YAML anchors
  steps:
    - step: &setup_flutter
        name: Setup Flutter & Dependencies
        caches:
          - flutter 
          - pub
        script:
          - flutter --version
          - flutter doctor -v
          - flutter pub get
        artifacts: # Make dependencies available for subsequent parallel steps if needed, though pub cache is better
          - .dart_tool/package_config.json
          - pubspec.lock

    - step: &setup_node
        name: Setup Node.js
        caches:
          - node
        script:
          - echo "Installing Node.js"
          - sudo apt-get update
          - sudo apt-get install -y curl gnupg
          - curl -sSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          - sudo apt-get install -y nodejs

    - step: &lint
        name: Lint & Analyze
        caches:
          - flutter
          - pub
        script:
          - flutter analyze .

    - step: &build_web_uat
        name: Build Web App (UAT)
        caches:
          - flutter
          - pub
        script:
          - BUILD_NAME=${BITBUCKET_TAG:-"1.0.$BITBUCKET_BUILD_NUMBER"}
          - BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER

          - echo "Building Web App (UAT) --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          - npm run build-web-uat

    - step: &build_web_prod
        name: Build Web App (PROD)
        caches:
          - flutter
          - pub
        script:
          - BUILD_NAME=${BITBUCKET_TAG:-"1.0.$BITBUCKET_BUILD_NUMBER"}
          - BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER

          - echo "Building Web App (PROD) --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          - npm run build-web-prod

    - step: &deploy_prod
        name: Deploy Web App (PROD)
        trigger: manual
        deployment: production
        caches:
          - firebase
          - firebase-tools
          - node
        script:
          - echo "Creating Firebase service account key file..."
          - echo $FIREBASE_SERVICE_ACCOUNT_KEY_JSON > $HOME/firebase-service-account-key.json
          # * Setting the GOOGLE_APPLICATION_CREDENTIALS environment variable
          - export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account-key.json

          - firebase login:list # Should show the service account
          - firebase projects:list # Should list projects the SA has access to

          - echo "Setting firebase config"
          - npm run use-prod
          - echo "Deploying Web App to Production..."
          - npm run deploy-web-prod
    - step: &deploy_uat
        name: Deploy Web App (UAT)
        trigger: manual
        deployment: uat
        script:
          - echo "Setting firebase config"
          - npm run use-uat
          - echo "Deploying Web App to UAT..."
          - npm run deploy-web-uat

pipelines:
  # Default pipeline: Runs on every push to any branch not explicitly defined below.
  default:
    - step: *setup_flutter
    - step: *setup_node
    - step: *lint


  # Pipeline for the main/development branch (e.g., 'develop' or 'main')
  branches:
    main: # Or your primary development branch like 'develop'
      - step: *setup_flutter
      - step: *setup_node
      - step: *lint
      - step: *build_web_prod
      - step: *deploy_prod

    # Pipeline for release branches (e.g., 'release/v1.2.3')
    develop:
      - step: *setup_flutter
      - step: *setup_node
      - step: *lint
      - step: *build_web_uat
      - step: *deploy_uat


            
  # Optional: Pipeline for tags (e.g., when you create a git tag like 'v1.2.3')
  # tags:
  #   'v*': # Matches tags like v1.0, v1.2.3, etc.
  #     - step: *setup
  #     - step: *lint
  #     - step: *flutter_test
  #     - parallel:
  #         - step: *flutter_build_android
  #         - step: *flutter_build_ios
  #     - step:
  #         name: Deploy Tagged Release to UAT
  #         trigger: manual
  #         script:
  #           - echo "Deploying tagged release $BITBUCKET_TAG to UAT..."
  #           # ... UAT deployment script
  #     - step:
  #         name: Deploy Tagged Release to PROD
  #         trigger: manual
  #         script:
  #           - echo "Deploying tagged release $BITBUCKET_TAG to PROD..."
  #           # ... PROD deployment script (ensure this is what you want for tags)

# --- General Good Practices & Notes ---
# 1. Secure Variables: Store all sensitive data (API keys, passwords, tokens like FIREBASE_TOKEN, ANDROID_STORE_PASSWORD, etc.)
#    in Bitbucket Pipelines settings: Repository settings > CI/CD > Repository variables. Mark them as "Secured".
#
# 4. Versioning:
#    - The script uses `BITBUCKET_BUILD_NUMBER` for `build-number` and `BITBUCKET_TAG` (if available) or a derivative of `BITBUCKET_BUILD_NUMBER` for `build-name`.
#    - For user-facing versions (e.g., 1.2.3), manage this in your `pubspec.yaml` and consider using Git tags to mark releases.
#      Your pipeline can extract the version from `pubspec.yaml` if needed:
#      `VERSION_NAME=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)`
#
# 5. Flutter SDK Version:
#    - Pin the Flutter version in `image: cirrusci/flutter:<version>` (e.g., `cirrusci/flutter:3.22.0`) for reproducible builds.
#    - Avoid using `:latest` or `:stable` for critical production pipelines as they can change unexpectedly.
#
# 6. Artifacts:
#    - Artifacts are defined in each build step and are automatically passed to subsequent steps in the same pipeline execution.
#    - You can download them from the Bitbucket UI.
#
# 7. Deployment Scripts:
#    - The deployment steps (`Deploy to UAT`, `Deploy to PROD`) are placeholders.
#    - You need to replace the `echo` commands with your actual deployment commands/scripts (e.g., using `scp`, `rsync`, `firebase deploy`, `fastlane`, or custom API calls to cloud services).
#
# 8. Notifications:
#    - Configure Bitbucket notifications (email, Slack) for pipeline status updates in your repository settings.
#
# 9. Resource Limits:
#    - For larger projects, you might need to increase the default resource allocation for steps.
#      `size: 2x` can be added to a step definition for double resources (if your plan allows).
#
# 10. Testing Strategy:
#     - The script includes unit/widget tests. Consider adding integration tests if applicable.
#     - For UI-heavy integration tests, you might need emulators/simulators or a device farm service, which adds complexity.
