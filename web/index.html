<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">

  <!-- Primary meta tags -->
  <title>Tennis Bookings — Book Tennis Courts Online & Manage Club Memberships</title>
  <meta name="description" content="Tennis Bookings makes it easy to find and book tennis courts online, manage club memberships, and connect with players near you. Reserve your court in seconds.">
  <meta name="keywords" content="tennis court booking, book tennis court online, tennis court reservation, tennis club membership, tennis courts near me, find tennis players, tennis booking app, tennis court scheduler, online tennis booking, tennis club management">
  <meta name="author" content="Tennis Bookings">
  <meta name="theme-color" content="#1F6B4A">

  <!-- Canonical URL — replace with your custom domain if applicable -->
  <link rel="canonical" href="https://tennisbookings.web.app/">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tennis Bookings">
  <meta property="og:title" content="Tennis Bookings — Book Tennis Courts Online & Manage Club Memberships">
  <meta property="og:description" content="Find and book tennis courts online, manage club memberships, and connect with players near you. Reserve your court in seconds.">
  <meta property="og:url" content="https://tennisbookings.web.app/">
  <meta property="og:image" content="https://tennisbookings.web.app/icons/ic_launcher_512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Tennis Bookings app icon">
  <meta property="og:locale" content="en_AU">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tennis Bookings — Book Tennis Courts Online">
  <meta name="twitter:description" content="Find and book tennis courts online, manage club memberships, and connect with players near you.">
  <meta name="twitter:image" content="https://tennisbookings.web.app/icons/ic_launcher_512.png">
  <meta name="twitter:image:alt" content="Tennis Bookings app icon">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tennis Bookings">
  <link rel="apple-touch-icon" href="icons/ic_launcher-192.png">
  <meta name="google-signin-client_id" content="844257141722-07uhim07mgnhgm687i19if228or37hq9.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tennis Bookings",
    "url": "https://tennisbookings.web.app/",
    "description": "Tennis Bookings makes it easy to find and book tennis courts online, manage club memberships, and connect with players near you.",
    "applicationCategory": "SportsApplication",
    "operatingSystem": "Web",
    "inLanguage": "en",
    "offers": {
      "@type": "Offer",
      "description": "Book tennis courts and manage club memberships online"
    },
    "featureList": [
      "Online tennis court booking",
      "Club membership management",
      "Player discovery and connection",
      "Court availability scheduling",
      "Secure online payments"
    ]
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #flutter-loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #1B3427 0%, #1F6B4A 55%, #2E8B5F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #flutter-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loading-title {
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .loading-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-in {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .loading-logo {
      animation: pulse-in 0.6s ease both;
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <div class="loading-logo">
      <span class="loading-title">Tennis Bookings</span>
      <span class="loading-subtitle">Loading your courts&hellip;</span>
    </div>
    <div class="loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
