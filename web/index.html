<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tennis Bookings is a web application that allows users to book tennis courts, manage club memberships and find new players!">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tennis Bookings">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="google-signin-client_id" content="844257141722-07uhim07mgnhgm687i19if228or37hq9.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tennis Bookings</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #flutter-loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #1B3427 0%, #1F6B4A 55%, #2E8B5F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #flutter-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loading-title {
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .loading-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-in {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .loading-logo {
      animation: pulse-in 0.6s ease both;
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <div class="loading-logo">
      <span class="loading-title">Tennis Bookings</span>
      <span class="loading-subtitle">Loading your courts&hellip;</span>
    </div>
    <div class="loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
